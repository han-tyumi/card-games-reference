<text x="116.0" y="32.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">On the table</text>
<text x="116.0" y="84.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Beats it</text>
<text x="116.0" y="136.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#a4243b">Not a beat</text>
<text x="116.0" y="188.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#a4243b">Not a beat</text>
<text x="138.0" y="220.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">A play can only be answered by one the same size. Two</text>
<text x="138.0" y="232.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">pairs of the same rank are separated by their better</text>
