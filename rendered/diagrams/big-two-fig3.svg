<text x="87.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">On the table</text>
<text x="87.0" y="82.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Beats it</text>
<text x="87.0" y="147.0" font-family="system-ui, sans-serif" font-size="9" fill="#a4243b">Not a beat</text>
<text x="87.0" y="212.0" font-family="system-ui, sans-serif" font-size="9" fill="#a4243b">Not a beat</text>
<text x="138.0" y="272.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">A play can only be answered by one the same size. Two</text>
