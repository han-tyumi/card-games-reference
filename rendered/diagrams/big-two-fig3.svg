<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 268" width="442" height="429" role="img" aria-label="Big Two: A play can only be answered by one the same size. Two pairs of the same rank are separated by their better suit, so a pair topped by a spade beats a pair topped by a heart.">
