<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 381" width="442" height="610" role="img" aria-label="Truco: Brazilian truco instead turns a card, the vira, and promotes the four cards of the next rank up to manilhas. With a five turned, the sixes are the manilhas and no six is left in the ordinary order.">
