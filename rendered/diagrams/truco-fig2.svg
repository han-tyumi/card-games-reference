<text x="51.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Vira</text>
<text x="51.0" y="102.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Manilhas</text>
<text x="51.0" y="187.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Everything else</text>
