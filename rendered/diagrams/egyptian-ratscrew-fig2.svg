<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 255" width="442" height="408" role="img" aria-label="Egyptian Ratscrew: Extras, live only if the table agreed them before the first card was turned. Tens means two cards adding to exactly ten, with an ace as one and jacks, queens and kings as nothing.">
<title>Extras, live only if the table agreed them before the first card was turned. Tens means two cards adding to exactly ten, with an ace as one and jacks, queens and kings as nothing.</title>
<rect x="87.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<rect x="123.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Q♠</text>
<rect x="87.0" y="86.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="111.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">6♥</text>
<rect x="123.0" y="86.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="111.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">4♣</text>
<rect x="87.0" y="151.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="176.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">5♠</text>
<rect x="123.0" y="151.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="176.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">6♥</text>
<rect x="159.0" y="151.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="176.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">7♦</text>
<text x="87.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Marriage</text>
<text x="87.0" y="82.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Tens</text>
<text x="87.0" y="147.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Run</text>
<text x="138.0" y="207.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Extras, live only if the table agreed them before the</text>
<text x="138.0" y="219.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">first card was turned. Tens means two cards adding to</text>
<text x="138.0" y="231.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">exactly ten, with an ace as one and jacks, queens and</text>
<text x="138.0" y="243.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">kings as nothing.</text>
