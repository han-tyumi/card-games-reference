<text x="138.0" y="61.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Opponent</text>
<text x="118.0" y="158.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Stock</text>
<text x="158.0" y="158.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Trump</text>
<text x="158.0" y="167.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">card (briscola)</text>
<text x="138.0" y="250.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your</text>
<text x="138.0" y="259.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">hand</text>
<text x="138.0" y="276.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The two-handed deal. The trump card sits face up with</text>
<text x="138.0" y="288.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">the rest of the pack laid across it, so the suit stays</text>
<text x="138.0" y="300.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">in plain sight all game and that one card is the last</text>
<text x="138.0" y="312.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">draw of the deal.</text>
