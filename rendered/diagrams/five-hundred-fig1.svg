<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 211" width="442" height="338" role="img" aria-label="Five Hundred: Trump ranking with diamonds as trump. The joker tops everything, both red jacks are trumps, and the ten therefore follows the queen. The order runs on down to the 4.">
<title>Trump ranking with diamonds as trump. The joker tops everything, both red jacks are trumps, and the ten therefore follows the queen. The order runs on down to the 4.</title>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Jkr</text>
<text x="84.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Always</text>
<text x="84.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">highest</text>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♦</text>
<text x="120.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Right</text>
<text x="120.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">bower</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♥</text>
<text x="156.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Left bower</text>
<rect x="177.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">A♦</text>
<rect x="69.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<rect x="105.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♦</text>
<rect x="141.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">10♦</text>
<text x="156.0" y="137.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Both jacks</text>
<text x="156.0" y="146.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">have gone</text>
<rect x="177.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">9♦</text>
<text x="69.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Trump, high to low</text>
<text x="138.0" y="163.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Trump ranking with diamonds as trump. The joker tops</text>
<text x="138.0" y="175.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">everything, both red jacks are trumps, and the ten</text>
<text x="138.0" y="187.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">therefore follows the queen. The order runs on down to</text>
<text x="138.0" y="199.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">the 4.</text>
</svg>