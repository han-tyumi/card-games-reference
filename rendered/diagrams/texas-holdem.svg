<text x="183.0" y="59.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Opponents' hole cards</text>
<text x="23.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Deck</text>
<text x="143.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Flop</text>
<text x="223.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Turn</text>
<text x="263.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">River</text>
<text x="343.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Burn</text>
<text x="343.0" y="159.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">cards</text>
<text x="183.0" y="240.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your</text>
<text x="183.0" y="249.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">hole cards</text>
<text x="183.0" y="266.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The table once the board is complete. The five shared cards arrive in</text>
<text x="183.0" y="278.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">three instalments with a betting round between each, and every player</text>
<text x="183.0" y="290.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">builds a hand from those five plus their own two.</text>
