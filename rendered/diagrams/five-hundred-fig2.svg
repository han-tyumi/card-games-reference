<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 230" width="442" height="368" role="img" aria-label="Five Hundred: The other suits rank normally, but the one sharing trump's colour is missing its jack, because that card is now the left bower. Red suits run down to the 4 and black suits to the 5.">
<title>The other suits rank normally, but the one sharing trump's colour is missing its jack, because that card is now the left bower. Red suits run down to the 4 and black suits to the 5.</title>
<rect x="51.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="66.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">A♥</text>
<rect x="87.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♥</text>
<rect x="123.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♥</text>
<rect x="159.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">10♥</text>
<text x="174.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">No jack in</text>
<text x="174.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">this suit</text>
<rect x="195.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="210.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">9♥</text>
<rect x="51.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="66.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<rect x="87.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">K♠</text>
<rect x="123.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Q♠</text>
<rect x="159.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♠</text>
<rect x="195.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="210.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">10♠</text>
<text x="51.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Hearts, trump's colour</text>
<text x="51.0" y="102.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Spades or clubs</text>
<text x="138.0" y="182.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The other suits rank normally, but the one sharing</text>
<text x="138.0" y="194.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">trump's colour is missing its jack, because that card</text>
<text x="138.0" y="206.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">is now the left bower. Red suits run down to the 4 and</text>
<text x="138.0" y="218.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">black suits to the 5.</text>
</svg>