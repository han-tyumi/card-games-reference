<text x="118.0" y="66.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Second</text>
<text x="118.0" y="75.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">to pick</text>
<text x="158.0" y="66.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Third</text>
<text x="158.0" y="75.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">to pick</text>
<text x="98.0" y="162.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">First</text>
<text x="98.0" y="171.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">to pick, leads</text>
<text x="138.0" y="162.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">The</text>
<text x="138.0" y="171.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">blind</text>
<text x="178.0" y="162.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Fourth</text>
<text x="178.0" y="171.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">to pick</text>
<text x="138.0" y="258.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Dealer,</text>
<text x="138.0" y="267.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">picks last</text>
<text x="138.0" y="284.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Six cards each and two face down in the middle uses up</text>
<text x="138.0" y="296.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">all thirty-two. The chance to pick starts at the</text>
<text x="138.0" y="308.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">dealer's left and goes clockwise; that same seat leads</text>
<text x="138.0" y="320.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">to the first trick.</text>
