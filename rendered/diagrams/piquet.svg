<text x="138.0" y="237.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#5b6672">12</text>
<text x="138.0" y="67.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Younger</text>
<text x="138.0" y="76.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">hand (dealt)</text>
<text x="138.0" y="165.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">The</text>
<text x="138.0" y="174.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">talon</text>
<text x="138.0" y="262.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Elder</text>
<text x="138.0" y="271.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">hand (leads)</text>
<text x="138.0" y="288.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Twelve cards each and eight face down between them.</text>
<text x="138.0" y="300.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Elder takes from the top of the talon, up to five;</text>
<text x="138.0" y="312.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">younger takes from underneath whatever elder left,</text>
<text x="138.0" y="324.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">usually three.</text>
