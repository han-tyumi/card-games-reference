<text x="175.0" y="249.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<rect x="196.0" y="224.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1" opacity="0.65"/>
<text x="211.0" y="249.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">A♦</text>
<text x="116.0" y="32.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Set of sevens</text>
<text x="116.0" y="99.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Or the heart</text>
<text x="116.0" y="108.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">run</text>
