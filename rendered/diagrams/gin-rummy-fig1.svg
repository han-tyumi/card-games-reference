<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 400" width="442" height="640" role="img" aria-label="Gin Rummy: Each card counts in one meld only. Holding 7♣ 7♠ 7♥ 8♥ 9♥ you may take the set of sevens or the heart run, not both. Aces are low and do not wrap, so A-2-3 is a sequence and Q-K-A is not.">
<title>Each card counts in one meld only. Holding 7♣ 7♠ 7♥ 8♥ 9♥ you may take the set of sevens or the heart run, not both. Aces are low and do not wrap, so A-2-3 is a sequence and Q-K-A is not.</title>
<rect x="87.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">7♣</text>
<rect x="123.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">7♠</text>
<rect x="159.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">7♥</text>
<text x="174.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">one or the</text>
<text x="174.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">other</text>
<rect x="87.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">7♥</text>
<text x="102.0" y="156.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">not both</text>
<rect x="123.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">8♥</text>
<rect x="159.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">9♥</text>
<rect x="87.0" y="191.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="216.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<rect x="123.0" y="191.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="216.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">2♠</text>
<rect x="159.0" y="191.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="216.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">3♠</text>
<rect x="87.0" y="276.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1" stroke-dasharray="3 2"/>
<text x="102.0" y="301.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♦</text>
<rect x="123.0" y="276.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1" stroke-dasharray="3 2"/>
<text x="138.0" y="301.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<rect x="159.0" y="276.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1" stroke-dasharray="3 2"/>
<text x="174.0" y="301.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">A♦</text>
<text x="87.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Set of sevens</text>
<text x="87.0" y="102.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Or the heart run</text>
<text x="87.0" y="187.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Run, ace low</text>
<text x="87.0" y="272.0" font-family="system-ui, sans-serif" font-size="9" fill="#a4243b">Not a run</text>
<text x="138.0" y="352.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Each card counts in one meld only. Holding 7♣ 7♠ 7♥ 8♥</text>
<text x="138.0" y="364.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">9♥ you may take the set of sevens or the heart run, not</text>
<text x="138.0" y="376.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">both. Aces are low and do not wrap, so A-2-3 is a</text>
<text x="138.0" y="388.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">sequence and Q-K-A is not.</text>
