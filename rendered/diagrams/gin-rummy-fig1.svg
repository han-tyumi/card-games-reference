<text x="138.0" y="300.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Each card counts in one meld only. Holding 7♣ 7♠ 7♥ 8♥</text>
<text x="138.0" y="312.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">9♥ you may take the set of sevens or the heart run, not</text>
<text x="138.0" y="324.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">both. Aces are low and do not wrap, so A-2-3 is a</text>
<text x="138.0" y="336.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">sequence and Q-K-A is not.</text>
