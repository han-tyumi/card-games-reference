<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 198" width="442" height="317" role="img" aria-label="Conquian: The 40-card pack in sequence order. With no eight, nine or ten in it, the seven and the jack are neighbours, and the ace sits at the bottom and never wraps round to the king.">
<title>The 40-card pack in sequence order. With no eight, nine or ten in it, the seven and the jack are neighbours, and the ace sits at the bottom and never wraps round to the king.</title>
<rect x="51.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="66.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<text x="66.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">always low</text>
<rect x="87.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">2♠</text>
<rect x="123.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">3♠</text>
<rect x="159.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">4♠</text>
<rect x="195.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="210.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">5♠</text>
<rect x="51.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="66.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">6♠</text>
<rect x="87.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">7♠</text>
<text x="102.0" y="124.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">next to</text>
<text x="102.0" y="133.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">the jack</text>
<rect x="123.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♠</text>
<rect x="159.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Q♠</text>
<rect x="195.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="210.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">K♠</text>
<text x="138.0" y="150.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The 40-card pack in sequence order. With no eight, nine</text>
<text x="138.0" y="162.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">or ten in it, the seven and the jack are neighbours,</text>
<text x="138.0" y="174.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">and the ace sits at the bottom and never wraps round to</text>
<text x="138.0" y="186.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">the king.</text>
</svg>