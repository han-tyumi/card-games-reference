<text x="80.0" y="32.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Pinochle, 40</text>
<text x="80.0" y="99.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Run in trump,</text>
<text x="80.0" y="108.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">150</text>
<text x="80.0" y="171.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Royal</text>
<text x="80.0" y="180.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">marriage, 40</text>
<text x="80.0" y="243.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#a4243b">Not two</text>
<text x="80.0" y="252.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#a4243b">marriages</text>
<text x="138.0" y="300.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">A card may serve in combinations of different kinds at</text>
<text x="138.0" y="312.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">once, but never twice in the same kind. A run in trump</text>
<text x="138.0" y="324.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">already contains the royal marriage, so the 40 is not</text>
<text x="138.0" y="336.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">claimed again.</text>
