<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 336 120" width="336" height="120" role="img" aria-label="Euchre: Trump ranking with diamonds as trump. The jack of the same colour joins the trump suit and outranks the ace, which is the rule newcomers most often get wrong.">
<title>Trump ranking with diamonds as trump. The jack of the same colour joins the trump suit and outranks the ace, which is the rule newcomers most often get wrong.</title>
<rect x="82.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="97.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♦</text>
<text x="97.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Right</text>
<text x="97.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">bower</text>
<rect x="118.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="133.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♥</text>
<text x="133.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Left bower</text>
<rect x="154.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="169.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">A♦</text>
<rect x="190.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="205.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<rect x="226.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="241.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♦</text>
<rect x="262.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="277.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">10♦</text>
<rect x="298.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="313.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">9♦</text>
<text x="74.0" y="27.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Trump, high to</text>
<text x="74.0" y="36.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">low</text>
<text x="168.0" y="84.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Trump ranking with diamonds as trump. The jack of the same colour</text>
<text x="168.0" y="96.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">joins the trump suit and outranks the ace, which is the rule</text>
<text x="168.0" y="108.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">newcomers most often get wrong.</text>
</svg>