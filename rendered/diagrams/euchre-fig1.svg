<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 186" width="442" height="298" role="img" aria-label="Euchre: Trump ranking with diamonds as trump. The jack of the same colour joins the trump suit and outranks the ace, which is the rule newcomers most often get wrong.">
<title>Trump ranking with diamonds as trump. The jack of the same colour joins the trump suit and outranks the ace, which is the rule newcomers most often get wrong.</title>
<rect x="106.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="121.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♦</text>
<text x="121.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Right</text>
<text x="121.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">bower</text>
<rect x="142.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="157.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♥</text>
<text x="157.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Left bower</text>
<rect x="178.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="193.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">A♦</text>
<rect x="214.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="229.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<rect x="106.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="121.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♦</text>
<rect x="142.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="157.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">10♦</text>
<rect x="178.0" y="74.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="193.0" y="99.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">9♦</text>
<text x="98.0" y="27.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Trump, high to</text>
<text x="98.0" y="36.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">low</text>
<text x="138.0" y="150.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Trump ranking with diamonds as trump. The jack of the</text>
<text x="138.0" y="162.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">same colour joins the trump suit and outranks the ace,</text>
<text x="138.0" y="174.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">which is the rule newcomers most often get wrong.</text>
