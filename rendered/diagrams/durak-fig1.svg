<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 388" width="442" height="621" role="img" aria-label="Durak: Beating an attack card, with spades as trump. Suit and trump are the only things that matter — nothing about rank alone will do it.">
