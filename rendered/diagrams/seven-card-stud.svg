<text x="138.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Deck</text>
<text x="138.0" y="149.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Opponents</text>
<text x="118.0" y="238.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your</text>
<text x="118.0" y="247.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">hole cards</text>
<text x="158.0" y="238.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your</text>
<text x="158.0" y="247.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">door card</text>
<text x="138.0" y="264.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Third street, with three of the up to eight seats</text>
<text x="138.0" y="276.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">shown. Everyone holds two cards nobody can see and one</text>
<text x="138.0" y="288.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">that everybody can, and that single exposed card is all</text>
<text x="138.0" y="300.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">you have to read an opponent by.</text>
