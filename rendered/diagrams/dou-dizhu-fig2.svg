<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 218" width="442" height="349" role="img" aria-label="Dou Dizhu: The two plays that ignore the matching rule entirely, and the two that double what the hand is worth every time either appears.">
<title>The two plays that ignore the matching rule entirely, and the two that double what the hand is worth every time either appears.</title>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">8♠</text>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">8♥</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">8♦</text>
<rect x="177.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">8♣</text>
<text x="192.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Beats all</text>
<text x="192.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">but a rocket</text>
<rect x="69.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Jkr</text>
<rect x="105.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Jkr</text>
<text x="120.0" y="156.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Beats</text>
<text x="120.0" y="165.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">everything</text>
<text x="69.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Bomb</text>
<text x="69.0" y="102.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Rocket</text>
<text x="138.0" y="182.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The two plays that ignore the matching rule entirely,</text>
<text x="138.0" y="194.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">and the two that double what the hand is worth every</text>
<text x="138.0" y="206.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">time either appears.</text>
</svg>