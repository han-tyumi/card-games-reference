<text x="138.0" y="189.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Six cards each, shown for four players. The trump lies</text>
<text x="138.0" y="201.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">face up crosswise under the talon and is the last card</text>
<text x="138.0" y="213.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">drawn. Attack cards and the cards beating them stay</text>
<text x="138.0" y="225.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">paired until the bout ends.</text>
