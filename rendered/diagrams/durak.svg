<text x="138.0" y="66.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Each player</text>
<text x="98.0" y="163.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Talon</text>
<text x="138.0" y="163.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">The</text>
<text x="138.0" y="172.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">bout in progress</text>
<text x="178.0" y="163.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Beaten</text>
