<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 230" width="442" height="368" role="img" aria-label="Pitch: The distinction that catches everyone out. In a trick the ace beats the ten; in the count for Game the ten is worth more than the ace and more than anything else in the pack.">
<title>The distinction that catches everyone out. In a trick the ace beats the ten; in the count for Game the ten is worth more than the ace and more than anything else in the pack.</title>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<text x="120.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Beats the</text>
<text x="120.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">ten</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">10♠</text>
<rect x="105.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">10♠</text>
<text x="120.0" y="156.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">10 pips</text>
<rect x="141.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<text x="156.0" y="156.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">4 pips</text>
<text x="105.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Wins the trick</text>
<text x="105.0" y="102.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Worth more for</text>
<text x="105.0" y="111.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Game</text>
<text x="138.0" y="182.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The distinction that catches everyone out. In a trick</text>
<text x="138.0" y="194.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">the ace beats the ten; in the count for Game the ten is</text>
<text x="138.0" y="206.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">worth more than the ace and more than anything else in</text>
<text x="138.0" y="218.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">the pack.</text>
</svg>