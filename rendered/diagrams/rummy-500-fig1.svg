<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 336" width="442" height="538" role="img" aria-label="500 Rummy: An ace plays high or low, but never both ends of the same run. Melded low against the 2 it counts 1 point; anywhere else it is worth 15.">
