<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 199" width="442" height="318" role="img" aria-label="Briscola: Rank order inside every suit, high to low. This is the same in trumps and in plain suits — the trump suit does not reorder itself, it simply beats everything.">
