<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 444 108" width="710" height="173" role="img" aria-label="Briscola: Rank order inside every suit, high to low. This is the same in trumps and in plain suits — the trump suit does not reorder itself, it simply beats everything.">
<title>Rank order inside every suit, high to low. This is the same in trumps and in plain suits — the trump suit does not reorder itself, it simply beats everything.</title>
