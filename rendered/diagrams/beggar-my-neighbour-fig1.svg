<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 133" width="442" height="213" role="img" aria-label="Beggar-My-Neighbour: What each pay card costs the next player. These four ranks are the only ones that do anything; suits are irrelevant and the 2 through 10 are inert.">
<title>What each pay card costs the next player. These four ranks are the only ones that do anything; suits are irrelevant and the 2 through 10 are inert.</title>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<text x="84.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">4 cards</text>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♥</text>
<text x="120.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">3 cards</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♦</text>
<text x="156.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">2 cards</text>
<rect x="177.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♣</text>
<text x="192.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">1 card</text>
<text x="69.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Cards owed</text>
<text x="138.0" y="97.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">What each pay card costs the next player. These four</text>
<text x="138.0" y="109.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">ranks are the only ones that do anything; suits are</text>
<text x="138.0" y="121.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">irrelevant and the 2 through 10 are inert.</text>
</svg>