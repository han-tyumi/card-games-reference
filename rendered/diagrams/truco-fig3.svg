<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 230" width="442" height="368" role="img" aria-label="Truco: Uruguayan truco turns a muestra and five cards of its suit become piezas, outranking even the bravas, which are called matas there. Shown with cups (hearts) as the muestra suit.">
<title>Uruguayan truco turns a muestra and five cards of its suit become piezas, outranking even the bravas, which are called matas there. Shown with cups (hearts) as the muestra suit.</title>
<rect x="51.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="66.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">2♥</text>
<text x="66.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Counts 30</text>
<text x="66.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">for envido</text>
<rect x="87.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">4♥</text>
<text x="102.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">29</text>
<rect x="123.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">5♥</text>
<text x="138.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">28</text>
<rect x="159.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♥</text>
<text x="174.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">27</text>
<rect x="195.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="210.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♥</text>
<text x="210.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">27</text>
<rect x="51.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="66.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<rect x="87.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♣</text>
<rect x="123.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">7♠</text>
<rect x="159.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">7♦</text>
<text x="51.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Piezas</text>
<text x="51.0" y="102.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Then the matas</text>
<text x="138.0" y="182.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Uruguayan truco turns a muestra and five cards of its</text>
<text x="138.0" y="194.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">suit become piezas, outranking even the bravas, which</text>
<text x="138.0" y="206.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">are called matas there. Shown with cups (hearts) as the</text>
<text x="138.0" y="218.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">muestra suit.</text>
