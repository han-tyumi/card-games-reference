<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 204" width="442" height="326" role="img" aria-label="Truco: Uruguayan truco turns a muestra and five cards of its suit become piezas, outranking even the bravas, which are called matas there. Shown with cups (hearts) as the muestra suit.">
<title>Uruguayan truco turns a muestra and five cards of its suit become piezas, outranking even the bravas, which are called matas there. Shown with cups (hearts) as the muestra suit.</title>
<rect x="88.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="103.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">2♥</text>
<text x="103.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Counts 30</text>
<text x="103.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">for envido</text>
<rect x="124.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="139.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">4♥</text>
<text x="139.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">29</text>
<rect x="160.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="175.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">5♥</text>
<text x="175.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">28</text>
<rect x="196.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="211.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♥</text>
<text x="211.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">27</text>
<rect x="232.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="247.0" y="33.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♥</text>
<text x="247.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">27</text>
<rect x="88.0" y="80.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="103.0" y="105.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<rect x="124.0" y="80.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="139.0" y="105.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♣</text>
<rect x="160.0" y="80.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="175.0" y="105.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">7♠</text>
<rect x="196.0" y="80.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="211.0" y="105.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">7♦</text>
<text x="80.0" y="32.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Piezas</text>
<text x="80.0" y="104.0" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Then the matas</text>
<text x="138.0" y="156.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Uruguayan truco turns a muestra and five cards of its</text>
<text x="138.0" y="168.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">suit become piezas, outranking even the bravas, which</text>
<text x="138.0" y="180.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">are called matas there. Shown with cups (hearts) as the</text>
<text x="138.0" y="192.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">muestra suit.</text>
