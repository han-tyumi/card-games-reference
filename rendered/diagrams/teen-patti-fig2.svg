<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 303" width="442" height="485" role="img" aria-label="Teen Patti: The three weakest. Category always settles it before rank does, so the feeblest run there is, 4-3-2, beats the finest colour there is.">
<title>The three weakest. Category always settles it before rank does, so the feeblest run there is, 4-3-2, beats the finest colour there is.</title>
<rect x="87.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">K♣</text>
<rect x="123.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">9♣</text>
<rect x="159.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">4♣</text>
<text x="174.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">One suit,</text>
<text x="174.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">no run</text>
<rect x="87.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♦</text>
<rect x="123.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Q♠</text>
<rect x="159.0" y="106.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="131.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">7♥</text>
<text x="174.0" y="156.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">The odd</text>
<text x="174.0" y="165.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">card breaks ties</text>
<rect x="87.0" y="191.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="216.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<rect x="123.0" y="191.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="216.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<rect x="159.0" y="191.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="216.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♣</text>
<text x="174.0" y="241.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Best of</text>
<text x="174.0" y="250.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">its kind</text>
<text x="87.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Colour</text>
<text x="87.0" y="102.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Pair</text>
<text x="87.0" y="187.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">High card</text>
<text x="138.0" y="267.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The three weakest. Category always settles it before</text>
<text x="138.0" y="279.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">rank does, so the feeblest run there is, 4-3-2, beats</text>
<text x="138.0" y="291.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">the finest colour there is.</text>
</svg>