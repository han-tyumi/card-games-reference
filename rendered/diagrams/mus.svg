<text x="138.0" y="62.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your</text>
<text x="138.0" y="71.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">partner</text>
<text x="98.0" y="160.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Mano</text>
<text x="98.0" y="169.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">(dealer's right, speaks first)</text>
<text x="138.0" y="160.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Stock</text>
<text x="138.0" y="169.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">and discards</text>
<text x="178.0" y="160.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Opponent</text>
<text x="138.0" y="253.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Postre</text>
<text x="138.0" y="262.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">(the dealer)</text>
<text x="138.0" y="279.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Four cards each, twenty-four left face down for the</text>
<text x="138.0" y="291.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">discard phase. Partners face each other, so an opponent</text>
<text x="138.0" y="303.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">sits on either side of you and every signal you send</text>
<text x="138.0" y="315.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">has to cross the table between them.</text>
