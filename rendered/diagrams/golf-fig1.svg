<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 303" width="442" height="485" role="img" aria-label="Golf: Play onto the waste one rank up or one rank down, suits ignored. Ranks do not wrap in the standard game, so a king takes only a queen and an ace takes only a 2.">
<title>Play onto the waste one rank up or one rank down, suits ignored. Ranks do not wrap in the standard game, so a king takes only a queen and an ace takes only a 2.</title>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">8♦</text>
