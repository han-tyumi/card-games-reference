<text x="138.0" y="279.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Partners sit opposite. Twenty of the 24 cards are dealt</text>
<text x="138.0" y="291.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">five at a time; the last four stay in the middle and</text>
