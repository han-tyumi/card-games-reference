<text x="78.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Shoe</text>
<text x="158.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Dealer's</text>
<text x="158.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">upcard</text>
<text x="198.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Hole</text>
<text x="198.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">card</text>
<text x="138.0" y="147.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Players' hands</text>
<text x="138.0" y="173.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Three of the up to seven players shown. Only the</text>
<text x="138.0" y="185.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">dealer's second card is hidden; in shoe games the</text>
<text x="138.0" y="197.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">players' two cards are dealt face up.</text>
</svg>