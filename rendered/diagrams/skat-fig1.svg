<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 199" width="442" height="318" role="img" aria-label="Skat: A suit game with spades as trump. All four jacks desert their own suits to head the trump suit in an order that never changes, so trump runs eleven cards deep.">
<title>A suit game with spades as trump. All four jacks desert their own suits to head the trump suit in an order that never changes, so trump runs eleven cards deep.</title>
<rect x="33.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="48.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♣</text>
<text x="48.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Always</text>
<text x="48.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">highest</text>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♠</text>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♥</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">J♦</text>
<rect x="177.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<rect x="213.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="228.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">10♠</text>
<text x="228.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Above the</text>
<text x="228.0" y="80.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">king</text>
<rect x="33.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="48.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">K♠</text>
<rect x="69.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Q♠</text>
<rect x="105.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">9♠</text>
<rect x="141.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">8♠</text>
<rect x="177.0" y="87.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="112.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">7♠</text>
<text x="33.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Trump, high to low</text>
<text x="138.0" y="163.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">A suit game with spades as trump. All four jacks desert</text>
<text x="138.0" y="175.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">their own suits to head the trump suit in an order that</text>
<text x="138.0" y="187.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">never changes, so trump runs eleven cards deep.</text>
