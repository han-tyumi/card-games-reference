<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 133" width="442" height="213" role="img" aria-label="Egyptian Ratscrew: Turning one of these stops the rotation: the next player owes you a face card, and the rank you turned sets how many cards they get to find one.">
<title>Turning one of these stops the rotation: the next player owes you a face card, and the rank you turned sets how many cards they get to find one.</title>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♠</text>
<text x="84.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">1 card</text>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">Q♥</text>
<text x="120.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">2 cards</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
<text x="156.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">3 cards</text>
<rect x="177.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♣</text>
<text x="192.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">4 cards</text>
<text x="69.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Attempts owed</text>
<text x="138.0" y="97.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Turning one of these stops the rotation: the next</text>
<text x="138.0" y="109.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">player owes you a face card, and the rank you turned</text>
<text x="138.0" y="121.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">sets how many cards they get to find one.</text>
</svg>