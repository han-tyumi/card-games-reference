<text x="138.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">7 each; 13 in the two-player game</text>
<text x="138.0" y="146.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Each player's own melds, face up</text>
<text x="118.0" y="254.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Stock</text>
<text x="158.0" y="254.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Discard</text>
<text x="158.0" y="263.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">pile, spread</text>
<text x="138.0" y="280.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The discard pile is staggered into an overlapping</text>
<text x="138.0" y="292.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">ladder, never squared up, because any card in it can be</text>
<text x="138.0" y="304.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">taken along with everything above it.</text>
</svg>