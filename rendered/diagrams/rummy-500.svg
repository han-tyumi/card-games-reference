<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 316" width="442" height="506" role="img" aria-label="500 Rummy setup diagram">
<title>500 Rummy setup</title>
<rect x="63.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<rect x="103.0" y="8.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
