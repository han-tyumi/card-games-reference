<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 216" width="442" height="346" role="img" aria-label="Egyptian Ratscrew: The two patterns every table plays, reading left to right up to the top of the pile. A sandwich needs exactly one card in between; two cards in between is not one, and slapping it costs you a card.">
