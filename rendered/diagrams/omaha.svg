<text x="23.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Deck</text>
<text x="143.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Flop</text>
<text x="223.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Turn</text>
<text x="263.0" y="150.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">River</text>
<text x="143.0" y="243.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your</text>
<text x="143.0" y="252.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">hole cards</text>
<text x="143.0" y="269.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Four cards in front of each player and five in the</text>
<text x="143.0" y="281.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">middle. A finished hand takes exactly two from your own</text>
<text x="143.0" y="293.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">four and exactly three from the board — no other</text>
<text x="143.0" y="305.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">combination is legal, however good it looks.</text>
