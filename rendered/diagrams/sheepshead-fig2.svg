<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 133" width="442" height="213" role="img" aria-label="Sheepshead: Each of the three fail suits, high to low. Six cards, with the ten above the king and the queen and jack gone to the trumps.">
<title>Each of the three fail suits, high to low. Six cards, with the ten above the king and the queen and jack gone to the trumps.</title>
<rect x="33.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="48.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<text x="48.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">11 points</text>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">10♠</text>
<text x="84.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">10</text>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">K♠</text>
<text x="120.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">4</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">9♠</text>
<rect x="177.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">8♠</text>
<rect x="213.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="228.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">7♠</text>
<text x="33.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Any fail suit</text>
<text x="138.0" y="97.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Each of the three fail suits, high to low. Six cards,</text>
<text x="138.0" y="109.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">with the ten above the king and the queen and jack gone</text>
<text x="138.0" y="121.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">to the trumps.</text>
</svg>