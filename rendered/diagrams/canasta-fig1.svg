<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 348" width="442" height="557" role="img" aria-label="Canasta: A meld is three or more cards of the same rank, four through ace; suits are irrelevant. It must hold at least two natural cards and never more than three wild cards. There are no sequences in Canasta.">
