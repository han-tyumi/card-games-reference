<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 121" width="442" height="194" role="img" aria-label="Pinochle: Rank within a suit is not the usual order: the ace is high but the ten sits second, above the king.">
<title>Rank within a suit is not the usual order: the ace is high but the ten sits second, above the king.</title>
<rect x="33.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="48.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">A♠</text>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">10♠</text>
<text x="84.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Above K</text>
<rect x="105.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="120.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">K♠</text>
<rect x="141.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="156.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">Q♠</text>
<rect x="177.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="192.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">J♠</text>
<rect x="213.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="228.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">9♠</text>
<text x="33.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Any suit, high to low</text>
<text x="138.0" y="97.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Rank within a suit is not the usual order: the ace is</text>
<text x="138.0" y="109.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">high but the ten sits second, above the king.</text>
</svg>