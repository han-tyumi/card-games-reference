<text x="98.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Stock</text>
<text x="178.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Discard</text>
<text x="178.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">pile</text>
<text x="138.0" y="147.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your table cards</text>
<text x="138.0" y="238.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your</text>
<text x="138.0" y="247.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">hand</text>
<text x="138.0" y="264.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Every player gets the same nine cards: three face-down</text>
<text x="138.0" y="276.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">cards with a face-up card squared on top of each, plus</text>
<text x="138.0" y="288.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">a hand of three. The discard pile starts empty.</text>
