<text x="98.0" y="60.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Stock</text>
<text x="178.0" y="60.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Discard pile</text>
<text x="138.0" y="141.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your table cards</text>
<text x="138.0" y="224.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Your hand</text>
<text x="138.0" y="240.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Every player gets the same nine cards: three face-down</text>
<text x="138.0" y="252.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">cards with a face-up card squared on top of each, plus</text>
<text x="138.0" y="264.8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">a hand of three. The discard pile starts empty.</text>
