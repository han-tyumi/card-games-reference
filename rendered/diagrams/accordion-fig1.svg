<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 264" width="442" height="422" role="img" aria-label="Accordion: A pile moves left one place or left three places, and only when the exposed cards agree in suit or in rank. The mover is always the card on the right.">
