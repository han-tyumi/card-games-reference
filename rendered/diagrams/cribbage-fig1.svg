<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 348" width="442" height="557" role="img" aria-label="Cribbage: Scoring the show. A run is three or more consecutive ranks; the ace is low and runs never turn the corner. Every distinct combination in the five cards scores, so a card counts again and again.">
