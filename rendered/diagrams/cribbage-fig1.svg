<text x="247.0" y="274.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Starter</text>
<text x="80.0" y="27.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Run of three,</text>
