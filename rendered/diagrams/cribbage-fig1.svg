<text x="80.0" y="180.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">three, 8</text>
<text x="80.0" y="243.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Highest hand,</text>
<text x="80.0" y="252.5" text-anchor="end" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">29</text>
<text x="138.0" y="300.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Scoring the show. A run is three or more consecutive</text>
