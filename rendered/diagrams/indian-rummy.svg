<text x="118.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Stock,</text>
<text x="118.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">laid crosswise</text>
<text x="158.0" y="58.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Discard</text>
<text x="158.0" y="67.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">pile</text>
<text x="138.0" y="155.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Each player</text>
<text x="138.0" y="181.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Thirteen cards each. The stock lies at right angles</text>
<text x="138.0" y="193.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">over the turned-up card, so the rank that is wild this</text>
<text x="138.0" y="205.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">hand stays visible to everybody throughout.</text>
