<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 145" width="442" height="232" role="img" aria-label="Contract Bridge: The five denominations a contract can be in, weakest to strongest. At the same number, each one outranks everything to its left, so anything lower has to be bid a level higher.">
<title>The five denominations a contract can be in, weakest to strongest. At the same number, each one outranks everything to its left, so anything lower has to be bid a level higher.</title>
<rect x="51.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="66.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">♣</text>
<text x="66.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Lowest</text>
<rect x="87.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="102.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">♦</text>
<rect x="123.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="138.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">♥</text>
<rect x="159.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="174.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">♠</text>
<rect x="195.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="210.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#5b6672">NT</text>
<text x="210.0" y="71.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Highest</text>
<text x="51.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Denominations</text>
<text x="138.0" y="97.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">The five denominations a contract can be in, weakest to</text>
<text x="138.0" y="109.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">strongest. At the same number, each one outranks</text>
<text x="138.0" y="121.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">everything to its left, so anything lower has to be bid</text>
<text x="138.0" y="133.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">a level higher.</text>
</svg>