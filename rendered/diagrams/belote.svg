<text x="138.0" y="256.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Dealer</text>
<text x="138.0" y="282.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Partners sit opposite and play passes to the right.</text>
<text x="138.0" y="294.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Twenty cards go out first, five to each player; the</text>
<text x="138.0" y="306.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">twelve left over wait in the middle with the top one</text>
<text x="138.0" y="318.4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">face up as the trump on offer.</text>
