<text x="98.0" y="67.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Middlehand</text>
<text x="138.0" y="67.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">The</text>
<text x="138.0" y="76.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">skat</text>
<text x="178.0" y="67.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Rearhand</text>
<text x="178.0" y="76.6" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">(deals)</text>
<text x="138.0" y="165.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Forehand</text>
<text x="138.0" y="191.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Ten cards each and two face down in the middle.</text>
<text x="138.0" y="203.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Forehand sits to the dealer's left, speaks last in the</text>
<text x="138.0" y="215.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">auction and always leads to the first trick, whoever</text>
<text x="138.0" y="227.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">ends up declaring.</text>
