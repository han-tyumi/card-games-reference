<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 264" width="442" height="422" role="img" aria-label="Kings in the Corner: Aces are low, and every pile builds down in alternating colours. Nothing can be played on an ace, and a king only ever goes into a corner or onto an empty arm of the cross.">
