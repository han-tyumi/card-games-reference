<text x="78.0" y="61.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Playing blind</text>
<text x="198.0" y="61.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#5b6672">Playing seen</text>
<text x="138.0" y="87.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Three cards each, and the only visible difference</text>
<text x="138.0" y="99.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">between two players is whether they have picked theirs</text>
<text x="138.0" y="111.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">up. Blind players bet half as much and cannot be forced</text>
<text x="138.0" y="123.2" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">to a show.</text>
