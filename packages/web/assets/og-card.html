<!doctype html>
<!--
  Source for the link preview card.

  Rendered to icons/og.png at 1200x630 by `npm run og`, and committed. It is not
  regenerated on every build: it says nothing that changes, deliberately, so it
  never needs to. Anything with a game count on it would go stale the moment an
  entry is added, and a stale share card is worse than a plain one.

  The same file is what to upload as the repository's social preview.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex;
    align-items: center;
    gap: 72px;
    padding: 0 88px;
    background: #16202b;
    color: #fbfaf8;
    font: 400 28px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    /* A faint deal of cards behind the type, so the card is not a flat slab. */
    background-image: radial-gradient(circle at 78% 30%, #24374d 0%, #16202b 62%);
  }
  .mark { flex: 0 0 300px; }
  .mark svg { width: 300px; height: 300px; display: block; }
  h1 { font-size: 104px; letter-spacing: -0.02em; line-height: 1; color: #fbfaf8; }
  .pron { margin-top: 10px; font-size: 30px; font-style: italic; color: #8fb4dd; }
  .tag { margin-top: 30px; font-size: 40px; line-height: 1.3; color: #dfe3e8; max-width: 15ch; }
  .foot { margin-top: 34px; font-size: 25px; color: #9aa6b2; }
</style>
</head>
<body>
  <div class="mark">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#1f3a5f"/>
      <g transform="translate(256 262)">
        <g transform="rotate(-14)">
          <rect x="-132" y="-150" width="184" height="258" rx="20" fill="#456a99" stroke="#f4f6f8" stroke-width="9"/>
        </g>
        <g transform="rotate(9) translate(26 6)">
          <rect x="-92" y="-150" width="184" height="258" rx="20" fill="#fbfaf8" stroke="#16202b" stroke-width="7"/>
          <path d="M0 -70 C -34 -110, -84 -84, -84 -40 C -84 8, -30 42, 0 76 C 30 42, 84 8, 84 -40 C 84 -84, 34 -110, 0 -70 Z"
                fill="#a4243b"/>
        </g>
      </g>
    </svg>
  </div>
  <div>
    <h1>Naibi</h1>
    <p class="pron">NYE-bee</p>
    <p class="tag">How to play, for the deck you already own.</p>
    <p class="foot">Card game rules · free to reuse · works offline</p>
  </div>
</body>
</html>
