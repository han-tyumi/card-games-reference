name: Deploy

# The site publishes only what passed.
#
# Pages used to build from the branch, which meant it deployed in parallel with
# Validate rather than after it -- on one commit the deploy started a full
# second before the tests did. A red commit could and did reach readers. This
# runs on Validate succeeding instead, so nothing ships unvalidated.
#
# docs/ is committed and gated, so there is nothing to build here: the job
# uploads the directory as it stands in the commit that passed.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one in flight -- a half-finished
# deployment of a site people read offline is worse than a slightly late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # The commit that passed, not whatever main has drifted to since.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
