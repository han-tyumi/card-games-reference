name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate game entries against the schema
        run: python3 scripts/validate.py

      - name: Check rendered/ is up to date
        run: python3 scripts/render_markdown.py --check

      - name: Build the PDF
        run: python3 scripts/build_pdf.py --output /tmp/card-games-reference.pdf

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: card-games-reference-pdf
          path: /tmp/card-games-reference.pdf
