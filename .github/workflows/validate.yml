name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.18+ runs the .ts scripts directly, with no build step.
          node-version: "22.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate game entries against the schema
        run: npm run validate

      - name: Type-check the tooling
        run: npm run typecheck

      - name: Run the tests
        run: npm test

      - name: Check rendered/ is up to date
        run: npm run render -- --check

      - name: Build the PDF
        run: npm run pdf -- --output /tmp/naibi.pdf

      - name: Build the site
        run: npm run web

      - name: Upload the PDF
        uses: actions/upload-artifact@v4
        with:
          name: naibi-pdf
          path: /tmp/naibi.pdf
