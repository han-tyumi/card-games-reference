name: Release

# Releases cut themselves. A push to main that earns one gets one; a push of
# nothing but housekeeping gets nothing and says so.
#
# It runs on Validate finishing rather than on the push, so a release is never
# built from a commit that failed its own gate. Pages does deploy in parallel
# with Validate, but a release is a durable artifact and a deploy is not, so
# this one waits.
on:
  workflow_run:
    workflows: ["Validate"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    # A red Validate must not produce a release. Manual runs are trusted to
    # know what they are doing, and run the same gate anyway.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: the bump is read from the commits since the last
      # release, so a shallow clone would see nothing and release nothing.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Decide, and prepare the release
        id: prepare
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before="$(node -p "require('./packages/data/package.json').version")"
          npm run release -- --auto
          after="$(node -p "require('./packages/data/package.json').version")"

          if [ "$before" = "$after" ]; then
            echo "No release was due. This is a correct outcome, not a failure."
            echo "released=false" >> "$GITHUB_OUTPUT"
          else
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "version=$after" >> "$GITHUB_OUTPUT"
            echo "tag=v$after" >> "$GITHUB_OUTPUT"
          fi

      # Pushed before the release is created, so the tag names a commit that is
      # actually on main. A push from GITHUB_TOKEN does not retrigger Validate,
      # so the release commit cannot start this again.
      - name: Push the version bump
        if: steps.prepare.outputs.released == 'true'
        run: git push origin HEAD:main

      - name: Take the changelog entry for this version as the release notes
        if: steps.prepare.outputs.released == 'true'
        run: |
          # Stops at the next release heading, or at the link definitions that
          # close the file -- the last entry has no heading after it.
          awk -v v="${{ steps.prepare.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { inside = 1; next }
            inside && (/^## / || /^\[/) { exit }
            inside { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ ! -s /tmp/notes.md ]; then
            echo "::error::no changelog entry for ${{ steps.prepare.outputs.version }}"
            exit 1
          fi
          cat /tmp/notes.md

      # A stable asset name, so a link to releases/latest/download never needs
      # editing again. Which release it is comes off the booklet's cover.
      - name: Name the booklet for the release
        if: steps.prepare.outputs.released == 'true'
        run: cp rendered/naibi.pdf /tmp/naibi-booklet.pdf

      - name: Publish
        if: steps.prepare.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.prepare.outputs.tag }}" /tmp/naibi-booklet.pdf \
            --title "${{ steps.prepare.outputs.tag }}" \
            --notes-file /tmp/notes.md \
            --target "$(git rev-parse HEAD)" \
            --repo "$GITHUB_REPOSITORY"
