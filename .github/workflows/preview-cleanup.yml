name: Clean up previews

# A preview outlives the branch that made it unless something removes it. Each
# is a copy of the whole site -- three megabytes -- so left alone they pile up
# in the `site` branch's history for no one's benefit.
#
# On close rather than on merge: a pull request that was abandoned has no more
# use for its preview than one that landed.
#
# This edits the `site` branch and **does not deploy**. Its first run failed for
# exactly that reason: it declared the `github-pages` environment, which only
# the default branch may deploy to, and a `pull_request` event does not run
# there -- so the job was rejected in two seconds without ever reaching a
# runner. Not deploying is also the better shape. The next Deploy publishes the
# branch as it then stands, and after a merge that follows within a minute or
# two on its own, so removing the directory here is the whole job.
#
# The cost, stated: a pull request closed WITHOUT merging leaves its preview
# served until something else deploys. It carries noindex and says on the page
# that it is not the published site, so what lingers is stale rather than
# misleading.
on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      slug:
        description: "Preview slug to remove (the branch name, slashes as dashes)"
        required: true

permissions:
  # Only what it needs. It writes one branch and deploys nothing, so it wants
  # neither `pages: write` nor `id-token: write`.
  contents: write

# Shares the deploy workflow's group. Nothing here deploys, but a cleanup
# pushing to `site` while a deploy has it cloned would make that deploy's push
# fail -- so the two still take turns.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  remove:
    # Same rule as Deploy: a fork's branch never had a preview to remove.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Remove the preview, if it has one
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GIVEN: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          SLUG=$(printf '%s' "${GIVEN:-$BRANCH}" | tr '/' '-' | tr -cd 'A-Za-z0-9._-')
          # Alphanumeric first, so "." and ".." can never reach `git rm -r`.
          case "$SLUG" in
            [A-Za-z0-9]*) ;;
            *) echo "Refusing to clean a preview slot named '$SLUG'"; exit 1 ;;
          esac
          REMOTE="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          if ! git clone --depth 1 --branch site "$REMOTE" site 2>/dev/null; then
            echo "No site branch, so nothing to clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cd site
          if [ ! -d "preview/$SLUG" ]; then
            echo "No preview for $SLUG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git rm -rq "preview/$SLUG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove the preview for $SLUG"
          git push origin site
          echo "Removed preview/$SLUG. It stops being served at the next deploy." \
            >> "$GITHUB_STEP_SUMMARY"
